<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 15px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .date-picker {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .date-picker input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

      
        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            flex: 1;
            padding: 15px;
            background: #eef2f7;
            border-radius: 6px;
            text-align: center;
            border-left: 5px solid #2980b9;
        }

        .card h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .card span {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Attendance Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2980b9;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

       
        .status-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        .present {
            background-color: #2ecc71;
            color: white;
        }

        .present:hover {
            background-color: #27ae60;
        }

        .absent {
            background-color: #e74c3c;
            color: white;
        }

        .absent:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Student Attendance System</h1>
        <p>Quick Prototype — Manage and log student tracking efficiently.</p>
    </header>

    <div class="date-picker">
        <label for="attendance-date"><strong>Date:</strong> </label>
        <input type="date" id="attendance-date">
    </div>

    <!-- Attendance Dashboard Metrics -->
    <div class="stats-container">
        <div class="card">
            <h3>Total Students</h3>
            <span id="total-count">0</span>
        </div>
        <div class="card" style="border-left-color: #2ecc71;">
            <h3>Present</h3>
            <span id="present-count">0</span>
        </div>
        <div class="card" style="border-left-color: #e74c3c;">
            <h3>Absent</h3>
            <span id="absent-count">0</span>
        </div>
    </div>

    <!-- Attendance Roster Table -->
    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="student-table-body">
            <!-- Dynamic rows will be inserted here by JavaScript -->
        </tbody>
    </table>
</div>

<script>
   
    const students = [
        { rollNo: "101", name: "Amit Sharma", status: "Present" },
        { rollNo: "102", name: "Priya Patel", status: "Present" },
        { rollNo: "103", name: "Rahul Verma", status: "Absent" },
        { rollNo: "104", name: "Sneha Reddy", status: "Present" },
        { rollNo: "105", name: "Vikram Singh", status: "Absent" }
    ];

   
    document.getElementById('attendance-date').valueAsDate = new Date();

    
    function renderAttendanceSystem() {
        const tableBody = document.getElementById('student-table-body');
        tableBody.innerHTML = ""; // Clear existing rows

        let presentCounter = 0;
        let absentCounter = 0;

        students.forEach((student, index) => {
           
            if (student.status === "Present") presentCounter++;
            else absentCounter++;

           
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${student.rollNo}</strong></td>
                <td>${student.name}</td>
                <td>
                    <button class="status-btn ${student.status.toLowerCase()}" onclick="toggleStatus(${index})">
                        ${student.status}
                    </button>
                </td>
            `;
            tableBody.appendChild(row);
        });

        
        document.getElementById('total-count').innerText = students.length;
        document.getElementById('present-count').innerText = presentCounter;
        document.getElementById('absent-count').innerText = absentCounter;
    }

   
    function toggleStatus(index) {
        if (students[index].status === "Present") {
            students[index].status = "Absent";
        } else {
            students[index].status = "Present";
        }
        renderAttendanceSystem(); // Re-render table components with new data
    }

   
    renderAttendanceSystem();
</script>

</body>
</html>
